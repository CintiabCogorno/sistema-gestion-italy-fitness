# Datos privados (contraseña de MySQL, clave del administrador): se leen de este archivo local, que no se sube a GitHub
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/gimnasio_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# La contraseña de MySQL NO se escribe acá (este archivo se sube a GitHub).
# Va en application-local.properties, que está en .gitignore y queda solo en tu computadora.
# (Ver application-local.properties.example)

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# La sesión se cierra sola tras 30 minutos sin usar el sistema
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Administrador inicial (se crea UNA sola vez, al arrancar, si todavía no hay ninguno)
gimnasio.admin.usuario=admin
# Contraseña inicial (mínimo 8 caracteres). Si la dejás vacía, se genera una al azar y se muestra
# en la consola de IntelliJ al arrancar. Después se cambia desde "Cambiar contraseña" en el sistema.
gimnasio.admin.clave=